version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panelium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelium_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-panelium}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panelium} -d ${POSTGRES_DB:-panelium}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-panelium}:${POSTGRES_PASSWORD:-panelium_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-panelium}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-panelium_super_secret_jwt_2026}
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
