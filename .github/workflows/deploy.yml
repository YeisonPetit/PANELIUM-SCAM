name: 🚀 Deploy a paneliumscan.com

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST=$(echo "$VPS_HOST" | tr -d '\r\n ')
          echo "CLEAN_HOST=$HOST" >> $GITHUB_ENV
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configurado correctamente para $HOST"

      - name: 📦 Subir código al VPS
        run: |
          # Asegurar que el directorio remoto exista
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@${{ env.CLEAN_HOST }} "mkdir -p /opt/panelium"
          
          # Sincronizar archivos
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='apps/*/node_modules' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ root@${{ env.CLEAN_HOST }}:/opt/panelium/

      - name: 🐳 Build y deploy con Docker Compose
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@${{ env.CLEAN_HOST }} "bash -s" << 'ENDSSH'
            set -e
            cd /opt/panelium

            echo "🔨 Construyendo imágenes Docker..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "🚀 Reiniciando servicios..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "⏳ Esperando que los servicios estén listos..."
            sleep 10

            echo "✅ Estado de los servicios:"
            docker compose -f docker-compose.prod.yml ps

            echo "❤️  Health check:"
            curl -sf http://localhost/health && echo "✅ API OK" || echo "⚠️ API aún iniciando..."
          ENDSSH

      - name: ✅ Deploy completado
        run: echo "🎉 Deploy exitoso a https://paneliumscan.com"

