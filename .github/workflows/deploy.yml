name: 🚀 Deploy a paneliumscan.com

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📦 Subir código al VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.VPS_HOST }}:/opt/panelium/

      - name: 🐳 Build y deploy con Docker Compose
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.VPS_HOST }} << 'ENDSSH'

            set -e
            cd /opt/panelium

            echo "🔨 Construyendo imágenes Docker..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "🚀 Reiniciando servicios..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "⏳ Esperando que los servicios estén listos..."
            sleep 15

            echo "✅ Estado de los servicios:"
            docker compose -f docker-compose.prod.yml ps

            echo "❤️  Health check:"
            curl -sf http://localhost/health && echo "API OK" || echo "API aún iniciando..."

          ENDSSH

      - name: ✅ Deploy completado
        run: |
          echo "🎉 Deploy exitoso a https://paneliumscan.com"
